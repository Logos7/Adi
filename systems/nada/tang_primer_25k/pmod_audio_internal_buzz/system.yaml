kind: fpga_system
system_family: nada

board: tang_primer_25k
variant: pmod_audio_internal_buzz
toolchain: gowin

fpga:
  device: GW5A-25B
  part_number: GW5A-LV25MG121NC1/I0
  device_code: gw5a25b-003

audio:
  module: PMOD-AUDIO v1.2
  interface: direct_square_wave
  connector: J4
  physical_slot: 3

buttons:
